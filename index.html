<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>香港輕鐵 ETA 地圖</title>
<meta name="description" content="屯門 · 元朗 · 天水圍 輕鐵到站時間實時地圖 — 支援深色模式、常用站書籤、離線可用。">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --bg:#f3f6fb; --card:#fff; --text:#0f172a; --muted:#5b6b84; --accent:#6366f1;
  --accent2:#0e7490; --border:#e2e8f0; --ok:#16a34a; --warn:#d97706; --danger:#dc2626;
  --radius:14px; --shadow:0 2px 10px rgba(15,23,42,.08);
}
[data-theme="dark"]{
  --bg:#0f172a; --card:#1e293b; --text:#f1f5f9; --muted:#94a3b8;
  --accent:#818cf8; --accent2:#22d3ee; --border:#334155; --shadow:0 2px 10px rgba(0,0,0,.4);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; height:100%}
body{font-family:"Noto Sans HK",-apple-system,"PingFang HK",sans-serif; background:var(--bg); color:var(--text); transition:.3s}
#map{position:fixed; inset:0; z-index:0; background:#dbe8f0}
[data-theme="dark"] #map{filter:invert(.92) hue-rotate(180deg) saturate(.7) brightness(.95)}
header{position:fixed; top:0; left:0; right:0; z-index:1000; backdrop-filter:blur(8px);
  background:color-mix(in srgb, var(--card) 82%, transparent); border-bottom:1px solid var(--border);
  padding:env(safe-area-inset-top) 14px 10px}
h1{font-size:18px; margin:0 0 8px; display:flex; align-items:center; gap:8px}
h1 .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok)}
.controls{display:flex; gap:8px; align-items:center}
#q{flex:1; padding:11px 14px; border:1px solid var(--border); border-radius:var(--radius);
  font-size:15px; background:var(--card); color:var(--text); outline:none}
#q:focus{border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
button.t{min-width:44px; height:44px; border:1px solid var(--border); border-radius:var(--radius);
  background:var(--card); color:var(--text); font-size:18px; cursor:pointer}
#list{position:fixed; top:0; bottom:0; right:0; width:min(360px,86vw); z-index:900; transform:translateX(100%);
  transition:transform .28s ease; background:var(--card); box-shadow:-4px 0 20px rgba(0,0,0,.15);
  display:flex; flex-direction:column}
#list.open{transform:translateX(0)}
#list .head{padding:16px 16px 8px; font-weight:700; font-size:16px; display:flex; justify-content:space-between; align-items:center}
#list ul{overflow-y:auto; list-style:none; margin:0; padding:0 10px 16px; flex:1}
#list li{padding:12px; border:1px solid var(--border); border-radius:var(--radius); margin-bottom:10px; cursor:pointer}
#list li .nm{font-weight:700; font-size:15px}
#list li .ln{font-size:12px; color:var(--muted)}
#list li .eta{margin-top:8px; display:grid; grid-template-columns:1fr 1fr; gap:6px}
.badge{display:flex; justify-content:space-between; background:color-mix(in srgb,var(--accent2) 12%,transparent);
  padding:6px 9px; border-radius:8px; font-size:13px}
.badge b{min-width:44px; text-align:right}
.empty{padding:20px; color:var(--muted); text-align:center}
#updated{position:fixed; bottom:calc(env(safe-area-inset-bottom) + 14px); left:50%; transform:translateX(-50%);
  z-index:1001; background:color-mix(in srgb,var(--card) 85%,transparent); color:var(--muted);
  font-size:12px; padding:7px 14px; border-radius:99px; border:1px solid var(--border);
  backdrop-filter:blur(6px); pointer-events:none; white-space:nowrap}
.popup .pl{font-size:13px; color:var(--muted); margin:0 0 4px}
.popup .ttl{font-size:13px; display:flex; justify-content:space-between; gap:10px; padding:2px 0; border-bottom:1px dashed var(--border)}
.popup .dest{color:var(--muted)}
.popup .min{font-weight:700; min-width:46px; text-align:right}
.leaflet-popup-content-wrapper{border-radius:12px}
.leaflet-popup-content{margin:10px 12px; min-width:180px}
.icon-star{filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
.leaflet-div-icon{background:transparent;border:none}
.marker{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--accent);color:#fff;font-weight:800;font-size:13px;border:2px solid #fff;
  box-shadow:0 2px 6px rgba(0,0,0,.3)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="map"></div>
<header>
  <h1><span class="dot"></span> 香港輕鐵 ETA</h1>
  <div class="controls">
    <input id="q" type="search" placeholder="🔍 搜尋車站…（屯門 / 元朗 / 天水圍）" autocomplete="off">
    <button class="t" id="theme" title="深色模式" aria-label="切換深色模式">🌙</button>
    <button class="t" id="listBtn" title="車站列表" aria-label="車站列表">☰</button>
  </div>
</header>

<div id="list">
  <div class="head"><span>🚉 車站</span><button class="t" id="closeList">✕</button></div>
  <ul id="stations"></ul>
</div>

<div id="updated">—</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
  "use strict";
  const $ = s => document.querySelector(s);
  const favKey = "lrt_favs";
  const themeKey = "lrt_theme";

  let map, state = { eta: {stations:{}}, geo: {features:[]}, favs: [], markers: {} };

  /* ---- theme ---- */
  function applyTheme(t){
    document.documentElement.setAttribute("data-theme", t);
    $("#theme").textContent = t === "dark" ? "☀️" : "🌙";
    if(map) setTimeout(()=>map.invalidateSize(), 100);
  }
  let theme = localStorage.getItem(themeKey) ||
    (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  applyTheme(theme);
  $("#theme").onclick = ()=> { theme = theme === "dark" ? "light" : "dark"; localStorage.setItem(themeKey, theme); applyTheme(theme); };

  /* ---- favourites ---- */
  function loadFavs(){ try{ state.favs = JSON.parse(localStorage.getItem(favKey)||"[]"); }catch(e){ state.favs=[]; } }
  function saveFavs(){ localStorage.setItem(favKey, JSON.stringify(state.favs)); }
  function isFav(c){ return state.favs.includes(c); }
  function toggleFav(c){ isFav(c) ? state.favs = state.favs.filter(f=>f!==c) : state.favs.push(c); saveFavs(); }

  /* ---- eta formatting ---- */
  function fmtETA(n){
    if(n<=0) return "🚉";
    if(n<60) return n+"分";
    return Math.floor(n/60)+"時"+(n%60)+"分";
  }
  function parseMins(s){
    // "6 mins" / "6 分鐘" / "2 分鐘 3 秒"
    if(!s) return null;
    const m = String(s).match(/(\d+)\s*分/); // Chinese
    if(m) return +m[1];
    const e = String(s).match(/(\d+)\s*mins?/i);
    return e ? +e[1] : null;
  }
  function buildETAHtml(station){
    const data = state.eta.stations[station.code];
    const p = data && data.platform_list ? data.platform_list : [];
    const rows = [];
    for(const plat of p){
      for(const r of plat.route_list || []){
        if(r.arrival_departure !== "A") continue; // only arrivals
        rows.push({
          route: (r.route_no||"?").padStart(3,"0"),
          dest: r.dest_ch || r.dest_en || "—",
          min: parseMins(r.time_ch || r.time_en),
          raw: r.time_ch || r.time_en || "—",
        });
      }
    }
    rows.sort((a,b)=>(a.min==null?999:a.min)-(b.min==null?999:b.min));
    if(rows.length===0) return `<div class="empty">暫無到站資訊</div>`;
    const top = rows.slice(0,4).map(r=>
      `<div class="ttl"><span><b>${r.route}</b> · <span class="dest">${r.dest}</span></span>`+
      `<span class="min">${r.min==null?r.raw:fmtETA(r.min)}</span></div>`).join("");
    return `<div class="pl">月台到車</div>`+top;
  }
  function etaSummary(station){
    const data = state.eta.stations[station.code];
    const p = data && data.platform_list ? data.platform_list : [];
    const mins=[];
    for(const plat of p) for(const r of plat.route_list||[]) if(r.arrival_departure==="A"){
      const m=parseMins(r.time_ch||r.time_en); if(m!=null) mins.push(m);
    }
    return mins;
  }

  /* ---- render list ---- */
  function renderList(){
    const ul = $("#stations");
    const q = ($("#q").value||"").trim().toLowerCase();
    let feats = state.geo.features;
    if(q) feats = feats.filter(f=> (f.properties.en||"").toLowerCase().includes(q) || (f.properties.zh||"").includes(q) || q.includes(f.properties.zh||""));
    // favourites first
    feats.sort((a,b)=> (isFav(b.properties.code)?1:0) - (isFav(a.properties.code)?1:0));
    if(feats.length===0){ ul.innerHTML = `<li class="empty">無匹配車站</li>`; return; }
    ul.innerHTML = feats.map(f=>{
      const fav = isFav(f.properties.code) ? "⭐ " : "";
      const mins = etaSummary(f.properties);
      const et = mins.length? mins.slice(0,2).map(fmtETA).join(" · ") : "";
      return `<li data-code="${f.properties.code}">
        <div class="nm">${fav}${f.properties.zh} <span style="color:var(--muted);font-weight:400;font-size:13px">${f.properties.en}</span></div>
        <div class="ln">輕鐵 ${f.properties.line||""}</div>
        ${et? `<div class="eta"><span class="badge"><span>班次</span><b style="color:var(--accent2)">${et}</b></span></div>`:""}
      </li>`;
    }).join("");
    ul.querySelectorAll("li[data-code]").forEach(li=>{
      li.onclick = ()=>{ selectStation(li.dataset.code); };
    });
  }

  /* ---- map ---- */
  function initMap(){
    map = L.map("map", { zoomControl: true }).setView([22.40, 113.98], 12);
    const isDark = theme === "dark";
    L.tileLayer(isDark
      ? "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png"
      : "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
      { maxZoom: 18, attribution: '&copy; OpenStreetMap &copy; CARTO' }).addTo(map);
    if(isDark) setTimeout(()=>map.invalidateSize(), 120);
  }

  /* ---- station selection ---- */
  function selectStation(code){
    const f = state.geo.features.find(x=>x.properties.code===code);
    if(!f) return;
    const lat=lng=f.geometry.coordinates[1], lon=f.geometry.coordinates[0];
    map.flyTo([lat,lon], 15, {duration:.8});
    // open popup
    const marker = state.markers[code];
    if(marker) {
      const c=state.geo.features.find(x=>x.properties.code===code);
      marker.bindPopup(()=>`<div class="popup"><b>${c.properties.zh}</b> <span class="dest">${c.properties.en}</span><br>${buildETAHtml(c.properties)}</div>`, {maxWidth:260}).openPopup();
    }
  }

  /* ---- load data ---- */
  async function loadData(){
    const [etaRes, geoRes] = await Promise.all([
      fetch("lrt_eta_data.json").then(r=>r.ok?r.json():null).catch(()=>null),
      fetch("stations.geojson").then(r=>r.ok?r.json():null).catch(()=>null),
    ]);
    if(etaRes) state.eta = etaRes; if(geoRes && geoRes.features) state.geo = geoRes;
    const u = state.eta.updated;
    $("#updated").textContent = u ? "⏱ 更新於 "+new Date(u).toLocaleTimeString("zh-HK")+"（每5分鐘自動）" : "—";
    if(!geoRes){ $("#updated").textContent="⚠️ 無法載入數據"; }
  }

  function clearMarkers(){
    Object.values(state.markers).forEach(m=>map.removeLayer(m));
    state.markers={};
  }
  function drawMarkers(){
    clearMarkers();
    state.geo.features.forEach(f=>{
      const [lon,lat]=f.geometry.coordinates;
      const code=f.properties.code;
      if(!lat || !lon) return;
      const div=L.divIcon({html:`<div class="marker">${isFav(code)?"<span class='icon-star'>⭐</span>":""}</div>`, className:"leaflet-div-icon"});
      const m=L.marker([lat,lon],{icon:div}).addTo(map);
      m.bindPopup(()=>`<div class="popup"><b>${f.properties.zh}</b> <span class="dest">${f.properties.en}</span><br>${buildETAHtml(f.properties)}</div>`,{maxWidth:260});
      m.on("popupopen", ()=>{ m.bindPopup(()=>`<div class="popup" style="width:190px"><b>${f.properties.zh}</b> <span class="dest">${f.properties.en}</span><div style="float:right"><button onclick="window.__toggleFav('${code}')">${isFav(code)?"★ 取消": "☆ 常用"}</button></div><br>${buildETAHtml(f.properties)}</div>`,{maxWidth:260}).openPopup(); });
      state.markers[code]=m;
    });
  }
  window.__toggleFav = c => { toggleFav(c); drawMarkers(); renderList(); };

  async function refresh(){
    await loadData(); drawMarkers(); renderList();
    setTimeout(refresh, 60000); // visual refresh of times every 60s
  }

  /* ---- ui wiring ---- */
  $("#listBtn").onclick = ()=> $("#list").classList.toggle("open");
  $("#closeList").onclick = ()=> $("#list").classList.remove("open");
  $("#q").addEventListener("input", renderList);

  // service worker
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  }

  initMap(); loadFavs(); refresh();
})();
</script>
</body>
</html>
